version: '3.8'

services:
  product-service:
    image: adedolapo05/ecommerce-product:latest
    ports:
      - "5001:5001"

  cart-service:
    image: adedolapo05/ecommerce-cart:latest
    ports:
      - "5002:5002"

  order-service:
    image: adedolapo05/ecommerce-order:latest
    ports:
      - "5003:5003"

  notification-service:
    image: adedolapo05/ecommerce-notification:latest
    ports:
      - "5004:5004"

  # New Frontend Dashboard Service
  frontend-service:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
