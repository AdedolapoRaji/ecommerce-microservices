<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Microservices Cluster Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --success: #38a169;
            --error: #e53e3e;
            --primary: #4299e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            color: #1a202c;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--primary);
        }

        .card.healthy::before { background-color: var(--success); }
        .card.unhealthy::before { background-color: var(--error); }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .healthy .status-badge { background: #c6f6d5; color: #22543d; }
        .unhealthy .status-badge { background: #fed7d7; color: #742a2a; }

        .data-box {
            background: #f7fafc;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>E-Commerce Microservices</h1>
        <p>Live Infrastructure Cluster Monitoring Console</p>
    </header>

    <div class="grid">
        <div id="product-card" class="card unhealthy">
            <h3>Product Catalog <span class="status-badge">Offline</span></h3>
            <div class="data-box" id="product-data">Loading service metrics...</div>
        </div>

        <div id="cart-card" class="card unhealthy">
            <h3>Shopping Cart <span class="status-badge">Offline</span></h3>
            <div class="data-box" id="cart-data">Loading service metrics...</div>
        </div>

        <div id="order-card" class="card unhealthy">
            <h3>Order Processing <span class="status-badge">Offline</span></h3>
            <div class="data-box" id="order-data">Loading service metrics...</div>
        </div>

        <div id="notification-card" class="card unhealthy">
            <h3>Notifications <span class="status-badge">Offline</span></h3>
            <div class="data-box" id="notification-data">Loading service metrics...</div>
        </div>
    </div>
</div>

<script>
    // Configured with your specific Manager Node IP
    const MANAGER_IP = '51.20.76.19'; 

    const services = [
        { id: 'product', url: `http://${MANAGER_IP}:5001/products` },
        { id: 'cart', url: `http://${MANAGER_IP}:5002/cart` },
        { id: 'order', url: `http://${MANAGER_IP}:5003/orders` },
        { id: 'notification', url: `http://${MANAGER_IP}:5004/notify` }
    ];

    function fetchServiceStatus(service) {
        const card = document.getElementById(`${service.id}-card`);
        const dataBox = document.getElementById(`${service.id}-data`);
        const badge = card.querySelector('.status-badge');

        fetch(service.url)
            .then(res => {
                if (!res.ok) throw new Error('Network response failure');
                return res.json();
            })
            .then(data => {
                card.className = 'card healthy';
                badge.innerText = 'Online';
                dataBox.innerText = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                card.className = 'card unhealthy';
                badge.innerText = 'Offline';
                dataBox.innerText = `Error connecting to backend API.`;
            });
    }

    // Run status checks on page load
    services.forEach(fetchServiceStatus);
    // Refresh every 10 seconds automatically
    setInterval(() => services.forEach(fetchServiceStatus), 10000);
</script>
</body>
</html>
